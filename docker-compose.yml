services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL-https://pockethost.exe.xyz}
    container_name: workey
    ports:
      - "8000:8000"
    environment:
      - WORKEY_DATA=/app/pb_data
      - WORKEY_ALLOWED_ORIGINS=${WORKEY_ALLOWED_ORIGINS-https://workey.exe.xyz,https://pockethost.exe.xyz,http://localhost:3000,http://localhost:8000}
    volumes:
      - pocketbase-data:/app/pb_data
    restart: unless-stopped
    networks:
      - workey-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pocketbase-data:
    driver: local

networks:
  workey-network:
    driver: bridge
