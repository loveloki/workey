version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workey
    ports:
      - "8000:8000"
    environment:
      - WORKEY_DATA=/app/data
    volumes:
      - workey-data:/app/data
      - workey-uploads:/app/data/uploads
    restart: unless-stopped
    networks:
      - workey-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  workey-data:
    driver: local
  workey-uploads:
    driver: local

networks:
  workey-network:
    driver: bridge
